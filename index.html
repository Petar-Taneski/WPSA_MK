<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic SEO Meta Tags -->
    <title>WPSA Macedonia - World Poultry Science Association</title>
    <meta
      name="description"
      content="WPSA Macedonia promotes advancement of knowledge in poultry science and industry through scientific meetings, research, and international collaboration."
    />
    <meta
      name="keywords"
      content="WPSA, World Poultry Science Association, Macedonia, poultry science, poultry industry, veterinary medicine"
    />
    <meta name="author" content="WPSA Macedonia" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="WPSA Macedonia - World Poultry Science Association"
    />
    <meta
      property="og:description"
      content="WPSA Macedonia promotes advancement of knowledge in poultry science and industry through scientific meetings, research, and international collaboration."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WPSA Macedonia" />
    <meta property="og:image" content="/Logo-WPSA.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="WPSA Macedonia - World Poultry Science Association"
    />
    <meta
      name="twitter:description"
      content="WPSA Macedonia promotes advancement of knowledge in poultry science and industry through scientific meetings, research, and international collaboration."
    />
    <meta name="twitter:image" content="/Logo-WPSA.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/Logo-WPSA-rounded.svg" />
    <link rel="apple-touch-icon" href="/Logo-WPSA.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#059669" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data for Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "World Poultry Science Association - Macedonian Branch",
        "alternateName": "WPSA Macedonia",
        "url": "https://wpsa-mk.com",
        "logo": "https://wpsa-mk.com/Logo-WPSA.png",
        "description": "WPSA Macedonia promotes advancement of knowledge in poultry science and industry through scientific meetings, research, and international collaboration.",
        "foundingDate": "2019",
        "knowsAbout": [
          "Poultry Science",
          "Veterinary Medicine",
          "Agriculture",
          "Livestock",
          "Research"
        ],
        "memberOf": {
          "@type": "Organization",
          "name": "World Poultry Science Association",
          "url": "https://www.wpsa.com"
        },
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "MK",
          "addressLocality": "Skopje"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
